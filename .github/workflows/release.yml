name: Build and Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27"

      - name: Build (unsigned Release)
        run: |
          xcodebuild build \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package
        run: |
          APP=$(find build/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          NAME="Orbit-${GITHUB_REF_NAME//\//-}-universal"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/$NAME.zip"
          hdiutil create -volname Orbit -srcfolder "$APP" -ov -format UDZO "dist/$NAME.dmg"
          pkgbuild --component "$APP" --install-location /Applications \
            --identifier dev.prateekthakur.Orbit \
            --version "${GITHUB_REF_NAME#v}" "dist/$NAME.pkg"

      - name: Verify universal binary
        run: |
          APP=$(find build/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          lipo -archs "$APP/Contents/MacOS/"*

      - uses: actions/upload-artifact@v4
        with:
          name: Orbit
          path: dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
